name: reproduce
on: [push, workflow_dispatch]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download the data
        run: curl -sSfL --create-dirs -o data/raw.zip https://www.kaggle.com/api/v1/datasets/download/anmolkumar/health-insurance-cross-sell-prediction
      - name: Run lab.py, then stream.py through Kafka and Spark, in the repo's Docker image
        run: docker compose run --rm -T lab sh -c 'python3 lab.py && spark-submit stream.py' > results.txt
      - name: Every number must match the committed results.txt
        run: cat results.txt && git ls-files --error-unmatch results.txt && git diff --exit-code results.txt
